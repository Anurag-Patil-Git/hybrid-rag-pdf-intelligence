services:
  backend:
    image: hybrid-rag-backend:latest
    container_name: rag-backend
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    image: hybrid-rag-frontend:latest
    container_name: rag-frontend
    ports:
      - "8501:8501"
    environment:
      RAG_API_URL: http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
